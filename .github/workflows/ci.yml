name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate dictionary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dictionary validator
        run: node tools/validate-data.js

  smoke-test:
    name: Smoke test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium browser
        run: npx playwright install chromium --with-deps
      - name: Run smoke tests
        # Часовой пояс пользователей: к востоку от UTC раньше ломались даты повторения.
        # Отдельные проверки внутри теста гоняют ещё и Asia/Almaty и America/New_York.
        env:
          TZ: Asia/Almaty
        run: node tools/smoke-test.js
